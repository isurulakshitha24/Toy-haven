<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Toy Haven - Cart</title>

<link rel="stylesheet"
      href="style.css">

<link rel="icon"
      href="images/favicon.png">

<script src="script.js"
        defer></script>

<link rel="manifest"
      href="manifest.json">

</head>

<body>

<header class="simple-header">

    <img src="images/logo.jpg"
         alt="Toy Haven Logo"
         class="logo-img">

    <h1>Toy Haven</h1>
    <button id="menuBtn"
        class="menu-btn"
        type="button">
    ☰
</button>

</header>


<nav>

<ul id="navMenu">

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Products</a></li>

<li><a href="cart.html">Cart</a></li>

<li><a href="wishlist.html">Wishlist</a></li>

<li><a href="checkout.html">Checkout</a></li>

<li><a href="feedback.html">Support</a></li>

</ul>

</nav>


<main>

<h1>Shopping Cart</h1>

<div id="cartItems"></div>

<h2>
Total: £<span id="cartTotal">0.00</span>
</h2>

<button onclick="clearCart()">
Clear Cart
</button>

<button onclick="location.href='checkout.html'">
Proceed to Checkout
</button>

</main>


<footer class="site-footer">

    <div class="footer-content">

        <div class="footer-section">

            <h2>Toy Haven</h2>

            <p>
                Toys for a Brighter Tomorrow
            </p>

        </div>


        <div class="footer-section">

            <h3>Quick Links</h3>

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="wishlist.html">Wishlist</a>

            <a href="feedback.html">Support</a>

        </div>


        <div class="footer-section">

            <h3>Newsletter</h3>

            <p>
                Subscribe for new toys and offers.
            </p>

            <div class="newsletter-box">

                <input type="email"
                       id="newsletterEmail"
                       placeholder="Enter your email">

                <button id="newsletterBtn">
                    Subscribe
                </button>

            </div>

            <p id="newsletterMessage"></p>

        </div>

    </div>


    <div class="footer-bottom">

        <p>
            © 2026 Toy Haven. All Rights Reserved.
        </p>

    </div>

</footer>

</body>
</html>
