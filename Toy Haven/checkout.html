<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Toy Haven - Checkout</title>

<link rel="stylesheet"
      href="style.css">

<link rel="icon"
      href="images/favicon.png">

<script src="script.js"
        defer></script>
<link rel="manifest"
      href="manifest.json">

</head>

<body>

<header class="simple-header">

    <img src="images/logo.jpg"
         alt="Toy Haven Logo"
         class="logo-img">

    <h1>Toy Haven</h1>
    <button id="menuBtn"
        class="menu-btn"
        type="button">
    ☰
</button>

</header>


<nav>

<ul id="navMenu">

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Products</a></li>

<li><a href="cart.html">Cart</a></li>

<li><a href="wishlist.html">Wishlist</a></li>

<li><a href="checkout.html">Checkout</a></li>

<li><a href="feedback.html">Support</a></li>

</ul>

</nav>


<main>

<h1>Checkout</h1>


<h2>Order Summary</h2>

<div id="orderSummary"></div>


<form id="checkoutForm">

<label for="fullName">
Full Name
</label>

<input type="text"
       id="fullName">


<label for="email">
Email
</label>

<input type="email"
       id="email">


<label for="address">
Delivery Address
</label>

<textarea id="address"></textarea>


<label for="payment">
Payment Method
</label>

<select id="payment">

<option value="">
Select Payment
</option>

<option value="Card">
Card
</option>

<option value="Cash on Delivery">
Cash on Delivery
</option>

</select>


<button type="submit"
        class="place-order-btn">
    Place Order
</button>

<p id="checkoutMessage"
   class="checkout-message">
</p>

</form>

</main>


<footer class="site-footer">

    <div class="footer-content">

        <div class="footer-section">

            <h2>Toy Haven</h2>

            <p>
                Toys for a Brighter Tomorrow
            </p>

        </div>


        <div class="footer-section">

            <h3>Quick Links</h3>

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="wishlist.html">Wishlist</a>

            <a href="feedback.html">Support</a>

        </div>


        <div class="footer-section">

            <h3>Newsletter</h3>

            <p>
                Subscribe for new toys and offers.
            </p>

            <div class="newsletter-box">

                <input type="email"
                       id="newsletterEmail"
                       placeholder="Enter your email">

                <button id="newsletterBtn">
                    Subscribe
                </button>

            </div>

            <p id="newsletterMessage"></p>

        </div>

    </div>


    <div class="footer-bottom">

        <p>
            © 2026 Toy Haven. All Rights Reserved.
        </p>

    </div>

</footer>

</body>
</html>
